experiment:
  name: "example_run"
  description: "A simple example run of the Tempo Bias pipeline"
  output_dir: "outputs/example_run"
  random_seed: 42

dataset:
  path: "example_dataset.csv"
  format: "csv"
  required_columns: ["sentence_id", "template", "entity"]

prompt:
  instruction: "Analyze the temporal bias in the following sentence."
  few_shot_examples: []
  label_space: ["biased", "unbiased"]
  language: "en"

model:
  provider: "openai" # Options: 'openai' or 'hf'
  model_name: "gpt-3.5-turbo"
  api_key_env: "OPENAI_API_KEY"
  inference_params:
    max_tokens: 50
    temperature: 0.0

metrics:
  enabled: ["IC"] # Prediction Inconsistency

output:
  save_raw: true
  save_metrics: true
